name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build in Docker container
        # Builds the Next.js static site inside Docker as per project rule
        run: |
          docker build --target builder -t sahyadri-builder -f Dockerfile .
          docker run --name builder sahyadri-builder /bin/true
          docker cp builder:/app/frontend/dist ./dist
          docker rm builder

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: sahyadri-healthcare
          directory: ./dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
