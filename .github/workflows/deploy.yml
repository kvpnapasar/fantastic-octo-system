name: Build and Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build in Docker
        # Using a Docker container to build the site as per user rule
        run: |
          docker build -t sahyadri-builder -f Dockerfile .
          # Extract the build output from the container
          # For Next.js on Cloudflare, we need the .vercel/output directory
          # Note: Our root Dockerfile needs to be updated to produce this if we use next-on-pages
          docker run --name builder sahyadri-builder /bin/true
          docker cp builder:/app/frontend/.vercel/output ./output
          docker rm builder

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: sahyadri-healthcare
          directory: ./output
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
